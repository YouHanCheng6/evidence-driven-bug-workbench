[project]
name = "zentao-mcp"
version = "0.3.0"
description = "ZenTao Bug reader with server-side workflow note support for DeerFlow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "mcp==1.28.1",
]

[project.scripts]
zentao-mcp = "zentao_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zentao_mcp"]
